<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="rewild.css"><script src="../../../engine/i18n.js"></script></head>
<body data-sim="network"><div class="slide">
  <span class="eyebrow" data-i18n="ecosystem.eyebrow"></span>
  <h2 class="t" data-i18n="ecosystem.h2"></h2>
  <div class="eco-layout">
    <div class="canvas-wrap map">
      <canvas class="sim" aria-hidden="true"></canvas>
      <div class="place p-chiba"><span data-i18n="ecosystem.chiba"></span><small data-i18n="ecosystem.chiba.small"></small></div>
      <div class="place p-tokyo"><span data-i18n="ecosystem.tokyo"></span><small data-i18n="ecosystem.tokyo.small"></small></div>
      <div class="place p-kyoto"><span data-i18n="ecosystem.kyoto"></span><small data-i18n="ecosystem.kyoto.small"></small></div>
      <div class="place p-london"><span data-i18n="ecosystem.london"></span><small data-i18n="ecosystem.london.small"></small></div>
    </div>
    <aside class="eco-note"><span class="prompt" data-i18n="ecosystem.note.tag"></span><blockquote data-i18n="ecosystem.note.quote"></blockquote><p data-i18n="ecosystem.note.p"></p></aside>
  </div>
  <div class="foot"><span data-i18n="ecosystem.foot"></span><span class="wordmark" data-i18n="brand"></span></div>
</div><script src="sim.js"></script></body></html>
