const S={en:{"eyebrow": "Shared working brief", "heading": "Middle powers", "prompt": "Enter the shared password to read the proposal.", "label": "Password", "button": "Read brief", "err_browser": "Please use a modern browser over HTTPS.", "err_password": "Incorrect password. Please try again."},ja:{"eyebrow": "共有用の作業資料", "heading": "ミドルパワー（中堅国）", "prompt": "提案を読むには、共有パスワードを入力してください。", "label": "パスワード", "button": "概要を読む", "err_browser": "HTTPS接続で最新のブラウザをお使いください。", "err_password": "パスワードが違います。もう一度お試しください。"}};const pickLang=()=>{const q=new URLSearchParams(location.search).get('lang');if(q==='ja'||q==='en')return q;try{const v=localStorage.getItem('lang');if(v==='ja'||v==='en')return v}catch(e){}for(const l of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||''])){const x=(l||'').toLowerCase();if(x.startsWith('ja'))return 'ja';if(x.startsWith('en'))return 'en'}return 'en'};const lang=pickLang();document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=S[lang][el.dataset.t]});if(lang==='ja')document.body.style.fontFamily='system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';
