const pickLang=()=>{let v=norm(new URLSearchParams(location.search).get('lang'));if(v)return v;try{v=norm(localStorage.getItem('lang'));if(v)return v;}catch(e){}for(const x of (navigator.languages||[navigator.language])){v=norm(x);if(v)return v;}return 'en';};
let lang=pickLang();const selector=document.getElementById('gate-lang');
function setLang(l,save){lang=l;document.documentElement.lang=l;document.title=S[l].title;selector.value=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=S[l][e.dataset.t]);document.getElementById('error').textContent='';if(save){try{localStorage.setItem('lang',l);}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u.href);}}

try{if(!crypto.subtle)throw new Error('unsupported');const payload=JSON.parse(document.getElementById('sealed').textContent);const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

document.open();document.write(html);document.close();
}catch(e){error.textContent=e.message==='unsupported'?S[lang].err_browser:S[lang].err_password;button.disabled=false;document.getElementById('password').focus();}});
