<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="survive.css"><script src="../../../engine/i18n.js"></script></head>
<body><div class="slide scale-slide">
  <span class="eyebrow part" data-i18n="scale.eyebrow"></span>
  <h2 class="t" data-i18n="scale.h2"></h2>
  <div class="scale">
    <section>
      <span class="kicker" data-i18n="scale.what.k"></span>
      <div class="chart"><img src="assets/drafting-windows.png" alt=""></div>
    </section>
    <section>
      <span class="kicker" data-i18n="scale.who.k"></span>
      <p class="countries" data-i18n="scale.countries"></p>
      <ul class="deliver">
        <li><b data-i18n="scale.d1"></b><span data-i18n="scale.d1.p"></span></li>
        <li><b data-i18n="scale.d2"></b><span data-i18n="scale.d2.p"></span></li>
      </ul>
      <blockquote><span data-i18n="scale.quote"></span><cite data-i18n="scale.cite"></cite></blockquote>
    </section>
  </div>
  <p class="src" data-i18n="scale.src"></p>
  <div class="foot"><span data-i18n="scale.foot"></span><span class="wordmark" data-i18n="brand"></span></div>
</div>
</body></html>
