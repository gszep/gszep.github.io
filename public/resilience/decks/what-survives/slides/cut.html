<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="survive.css"><script src="../../../engine/i18n.js"></script></head>
<body><div class="slide cut-slide">
  <span class="eyebrow part" data-i18n="cut.eyebrow"></span>
  <h2 class="t" data-i18n="cut.h2"></h2>
  <div class="cut">
    <div class="left">
      <svg class="rings" viewBox="0 0 480 480" aria-hidden="true">
        <defs><mask id="bite"><rect width="480" height="480" fill="white"/><circle cx="388" cy="112" r="176" fill="black"/></mask></defs>
        <circle class="lost" cx="240" cy="240" r="228"/>
        <circle class="ai" cx="240" cy="240" r="228" mask="url(#bite)"/>
        <circle class="own" cx="240" cy="240" r="92"/>
      </svg>
      <p data-i18n="cut.left"></p>
    </div>
    <div class="right">
      <span class="kicker acc-kicker" data-i18n="cut.right.k"></span>
      <div class="cards">
        <div class="card text">
          <b data-i18n="cut.c1"></b><p class="p" data-i18n="cut.c1.p"></p>
        </div>
        <div class="card">
          <div class="pic"><video src="assets/moving-talent.mp4" poster="assets/moving-talent.jpg" autoplay muted loop playsinline></video></div>
          <b data-i18n="cut.c2"></b><p class="p" data-i18n="cut.c2.p"></p>
        </div>
      </div>
    </div>
  </div>
  <p class="src" data-i18n="cut.src"></p>
  <div class="foot"><span data-i18n="cut.foot"></span><span class="wordmark" data-i18n="brand"></span></div>
</div>
</body></html>
